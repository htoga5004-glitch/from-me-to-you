<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status - Process Terminated</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #0f172a;
            color: #38bdf8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .terminal-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .terminal-header {
            background-color: #0f172a;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #334155;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-red { background-color: #ef4444; }
        .dot-yellow { background-color: #f59e0b; }
        .dot-green { background-color: #10b981; }

        .terminal-title {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-left: auto;
        }

        .terminal-body {
            padding: 24px;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .line {
            margin-bottom: 12px;
        }

        .status-ok {
            color: #4ade80;
            font-weight: bold;
        }

        .message-box {
            margin-top: 20px;
            padding: 16px;
            background-color: #0f172a;
            border-left: 3px solid #ec4899;
            border-radius: 4px;
            color: #f1f5f9;
        }

        .heart {
            color: #ec4899;
        }

        .footer-note {
            margin-top: 20px;
            color: #64748b;
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="terminal-card">
        <div class="terminal-header">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
            <span class="terminal-title">status.sh — bash</span>
        </div>
        
        <div class="terminal-body">
            <div class="line">&gt; Executing process: <b>read_letter.exe</b></div>
            <div class="line">&gt; Status: <span class="status-ok">200 OK (Completed)</span></div>
            <div class="line">&gt; Target: <b>Zii</b></div>
            <div class="line">&gt; Action: <b>Save to permanent memory</b></div>

            <div class="message-box">
                Surat sudah selesai dibaca  
            </div>

            <div class="footer-note">
                [ Process finished with exit code 0 ]
            </div>
        </div>
    </div>

</body>
</html>
